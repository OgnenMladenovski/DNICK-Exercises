{% extends 'base.html' %}
{% block content %}

<div class="row row-cols-2 row-cols-md-4 g-3">
    {% for movie in movies %}
    <div class="col">
        <div class="card h-100">
            <img src="{{ movie.poster.url }}" class="card-img-top">

            <div class="card-body d-flex flex-column">
                <h5 class="card-title">{{ movie.title }}</h5>
                <p class="card-text">{{ movie.price }} $</p>
                <a href="{% url 'movies:movie_details' movie.pk %}">Link</a>
            </div>
        </div>
    </div>
    {% empty %}
    <p class="text-muted">No movies found</p>

    {% endfor %}
</div>

{% endblock %}
