{% extends 'base.html' %}
{% block content %}

<div class="container">
    <div class="row row-cols-2">
        <div class="col-4 border border-black p-5">
            <h1>Add New Tour</h1>
            <div class="container">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{form.as_p}}
                    <button class="btn btn-danger" type="submit">Submit</button>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
